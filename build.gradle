plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.certimakers'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	archunitVersion = '1.3.0'
	springdocVersion = '2.8.6'
	blockhoundVersion = '1.0.17.RELEASE'
	jjwtVersion = '0.12.6'
	openPdfVersion = '1.4.2'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// 리액티브 시큐리티. 서블릿 필터 체인이 아니라 SecurityWebFilterChain을 쓴다(WebFlux 일관성).
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 이메일 인증 코드·비밀번호 재설정 토큰 저장소. Lettuce 기반이라 논블로킹이다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	// 이메일 발송. JavaMailSender는 블로킹이므로 BlockingBridge로 감싼다.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"

	// PDF 생성. fonts-extra가 한글 CJK 폰트(Adobe-Korea1)를 제공한다.
	implementation "com.github.librepdf:openpdf:${openPdfVersion}"
	implementation "com.github.librepdf:openpdf-fonts-extra:${openPdfVersion}"

	// JWT 발급·검증. 서명·파싱은 순수 CPU 작업이라 이벤트 루프에서 돌려도 블로킹이 아니다.
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	// 이메일 인증 통합 테스트용 Redis 컨테이너(전용 모듈 없이 GenericContainer로 띄운다).
	testImplementation 'org.assertj:assertj-core'

	// 아키텍처 규칙을 CI에서 강제한다. 이것이 빠지면 ADR-0001의 전제가 무너진다.
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"

	// 이벤트 루프에서의 블로킹 호출을 런타임에 잡는다. ADR-0002의 1차 방어선.
	testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockhoundVersion}"

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// BlockHound가 JDK 13+ 에서 코어 클래스를 계측하려면 필요하다.
	jvmArgs '-XX:+AllowRedefinitionToAddDeleteMethods', '-Dfile.encoding=UTF-8'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
	options.encoding = 'UTF-8'
}

