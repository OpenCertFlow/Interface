plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.certimakers'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	archunitVersion = '1.3.0'
	springdocVersion = '2.8.6'
	blockhoundVersion = '1.0.11.RELEASE'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.assertj:assertj-core'

	// 아키텍처 규칙을 CI에서 강제한다. 이것이 빠지면 ADR-0001의 전제가 무너진다.
	testImplementation "com.tngtech.archunit:archunit-junit5:${archunitVersion}"

	// 이벤트 루프에서의 블로킹 호출을 런타임에 잡는다. ADR-0002의 1차 방어선.
	testImplementation "io.projectreactor.tools:blockhound-junit-platform:${blockhoundVersion}"

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// BlockHound가 JDK 13+ 에서 코어 클래스를 계측하려면 필요하다.
	jvmArgs '-XX:+AllowRedefinitionToAddDeleteMethods', '-Dfile.encoding=UTF-8'
	testLogging {
		events 'failed'
		exceptionFormat = 'full'
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
	options.encoding = 'UTF-8'
}
