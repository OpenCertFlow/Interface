services:
  postgres:
    image: postgres:16-alpine
    container_name: certimakers-postgres
    environment:
      POSTGRES_DB: certimakers
      POSTGRES_USER: certimakers
      POSTGRES_PASSWORD: certimakers
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certimakers -d certimakers"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: certimakers-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: certimakers-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  ai-worker:
    # AI 워커는 별도 저장소(CertiMakers/MiddleWare)에서 빌드·배포된다.
    # 로컬 풀스택 실행 시에는 그 저장소에서 이미지를 빌드해 태그를 맞춘다:
    #   (MiddleWare) docker build -t certimakers/ai-worker:latest .
    image: certimakers/ai-worker:latest
    container_name: certimakers-ai-worker
    environment:
      # 키가 없으면 문장화는 템플릿으로 폴백한다. 운영에서는 반드시 주입.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CERTIMAKERS_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
