services:
  backend:
    # 이 저장소의 Dockerfile로 빌드한다. 인프라(K8s) 배포는 Infra/ 저장소가 담당하고,
    # 이 compose는 로컬 풀스택 실행용이다.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencertflow-backend
    environment:
      # 컨테이너 네트워크에서는 호스트가 서비스명이다(localhost 아님).
      DB_URL: jdbc:postgresql://postgres:5432/opencertflow
      DB_USERNAME: opencertflow
      DB_PASSWORD: opencertflow
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # AI 워커가 없어도 진단은 성립한다(DegradedFlags 폴백) — 하드 의존하지 않는다.
      AI_WORKER_URL: http://ai-worker:8000
      # 운영자 알림(#39). 호스트의 .env에서 전달되며, 비어 있으면 알림 전체가 비활성이다.
      # 값은 시크릿이라 이 파일이 아니라 배포 호스트의 .env에 둔다.
      OPENCERTFLOW_ALERT_WEBHOOK_URL: ${OPENCERTFLOW_ALERT_WEBHOOK_URL:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: opencertflow-postgres
    environment:
      POSTGRES_DB: opencertflow
      POSTGRES_USER: opencertflow
      POSTGRES_PASSWORD: opencertflow
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencertflow -d opencertflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opencertflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: opencertflow-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  ai-worker:
    # AI 워커는 별도 저장소(OpenCertFlow/MiddleWare)에서 빌드·배포된다.
    # 로컬 풀스택 실행 시에는 그 저장소에서 이미지를 빌드해 태그를 맞춘다:
    #   (MiddleWare) docker build -t opencertflow/ai-worker:latest .
    image: opencertflow/ai-worker:latest
    container_name: opencertflow-ai-worker
    environment:
      # 키가 없으면 문장화는 템플릿으로 폴백한다. 운영에서는 반드시 주입.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENCERTFLOW_QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
