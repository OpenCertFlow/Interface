spring:
  application:
    name: certimakers-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/certimakers}
    username: ${DB_USERNAME:certimakers}
    password: ${DB_PASSWORD:certimakers}
    hikari:
      # certimakers.blocking.jdbc-pool-size와 반드시 같은 값이어야 한다. ADR-0002 참조.
      # 시작 시 BlockingBridgeConfig가 불일치를 경고한다.
      maximum-pool-size: 10
      pool-name: certimakers-cp

  jpa:
    open-in-view: false          # WebFlux에는 뷰가 없다. 켜져 있으면 커넥션만 오래 잡는다.
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway만 바꾼다.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601로 내보낸다. Android가 파싱하기 쉽다.
    deserialization:
      fail-on-unknown-properties: false

certimakers:
  blocking:
    jdbc-pool-size: 10           # ← spring.datasource.hikari.maximum-pool-size와 동일하게
    queue-capacity: 1000
    ttl-seconds: 60

  ai-worker:
    base-url: ${AI_WORKER_URL:http://localhost:8000}
    # 응답 시간 예산. 초과 시 폴백한다 — 진단은 실패하지 않는다. docs/design/03-diagnosis-flow.md
    search-timeout: 2s
    narrate-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.certimakers: INFO

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.certimakers: DEBUG
    org.hibernate.SQL: DEBUG
