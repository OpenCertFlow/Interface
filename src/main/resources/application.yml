spring:
  application:
    name: opencertflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opencertflow}
    username: ${DB_USERNAME:opencertflow}
    password: ${DB_PASSWORD:opencertflow}
    hikari:
      # opencertflow.blocking.jdbc-pool-size와 반드시 같은 값이어야 한다. ADR-0002 참조.
      # 시작 시 BlockingBridgeConfig가 불일치를 경고한다.
      maximum-pool-size: 10
      pool-name: opencertflow-cp

  jpa:
    open-in-view: false          # WebFlux에는 뷰가 없다. 켜져 있으면 커넥션만 오래 잡는다.
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway만 바꾼다.
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false   # ISO-8601로 내보낸다. Android가 파싱하기 쉽다.
    deserialization:
      fail-on-unknown-properties: false

opencertflow:
  # 공식 문서 원문 변경 감지. 갱신은 하지 않고 감지만 한다(운영지침 9.2).
  # 외부 사이트를 주기적으로 두드리는 동작이라 기본은 꺼 두고, 운영에서 명시적으로 켠다.
  document-freshness:
    enabled: ${OPENCERTFLOW_DOCUMENT_FRESHNESS_ENABLED:false}
    cron: "0 0 4 * * MON"

  # 룰·가중치 정의 파일. 저장소의 rules/·weights/가 진실의 원천이고 DB는 런타임 사본이다.
  rules:
    sync-enabled: ${OPENCERTFLOW_RULES_SYNC:true}
    # 비우면 jar에 포함된 rules/를 쓴다. 자신의 룰셋으로 확장하려면 디렉터리를 가리킨다.
    path: ${OPENCERTFLOW_RULES_PATH:}
    weights-path: ${OPENCERTFLOW_WEIGHTS_PATH:}

  # 법제처 국가법령정보 공동활용 API. 법령 개정 이력을 원문 해시가 아니라 구조화된 값으로 읽는다.
  # 이용하려면 open.law.go.kr에서 신청해 이메일 ID를 발급받아야 한다. 키가 없으면 조용히 꺼진다.
  law:
    enabled: ${OPENCERTFLOW_LAW_ENABLED:false}
    oc: ${OPENCERTFLOW_LAW_OC:}
    base-url: https://www.law.go.kr

  # 제품안전정보센터(safetykorea) KC 인증 등록 현황. 룰의 인증 등급 근거를 확인할 때 쓴다.
  # 인증키는 자동 발급이 아니다 — safetykorea.kr/release/openapi2 에서 신청서를 받아
  # safetykorea@korea.kr 로 보내면 승인 후 이메일로 온다. 키가 없으면 조용히 꺼진다.
  # 인증은 쿼리 파라미터가 아니라 AuthKey 헤더로 보낸다.
  safetykorea:
    enabled: ${OPENCERTFLOW_SAFETYKOREA_ENABLED:false}
    auth-key: ${OPENCERTFLOW_SAFETYKOREA_KEY:}
    base-url: https://www.safetykorea.kr

  blocking:
    jdbc-pool-size: 10           # ← spring.datasource.hikari.maximum-pool-size와 동일하게
    queue-capacity: 1000
    ttl-seconds: 60

  auth:
    jwt:
      # 운영에서는 반드시 OPENCERTFLOW_AUTH_JWT_SECRET로 주입한다. HS256에는 32바이트 이상이 필요하다.
      secret: ${OPENCERTFLOW_AUTH_JWT_SECRET:opencertflow-local-development-secret-key-do-not-use-in-production}
      access-token-ttl-seconds: 1800      # 30분. 짧게 두고 리프레시로 갱신한다
      refresh-token-ttl-seconds: 1209600  # 14일
      issuer: opencertflow
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
    email:
      code-ttl-seconds: 300         # 인증 코드 5분
      reset-token-ttl-seconds: 1800 # 재설정 링크 30분
      reset-link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:8080/reset-password}
      from: ${MAIL_FROM:no-reply@opencertflow.local}
    # 시작 시 관리자로 승격할 계정. 최초 관리자를 만드는 유일한 통로이며,
    # 그 이후 권한 부여는 PATCH /api/v1/admin/users/{id}/role 로 한다.
    # 쉼표로 구분: OPENCERTFLOW_ADMIN_EMAILS=a@x.com,b@x.com
    bootstrap-admin-emails: ${OPENCERTFLOW_ADMIN_EMAILS:}

  file:
    # 업로드 파일이 저장되는 루트. 이 밖으로는 어떤 경로로도 쓰지 않는다.
    storage-root: ${FILE_STORAGE_ROOT:./data/uploads}
    max-size-in-bytes: ${FILE_MAX_SIZE_BYTES:20971520} # 20MB

  ai-worker:
    base-url: ${AI_WORKER_URL:http://localhost:8000}
    # 응답 시간 예산. 초과 시 폴백한다 — 진단은 실패하지 않는다. docs/design/03-diagnosis-flow.md
    search-timeout: 2s
    narrate-timeout: 5s
    # 회로 차단기(#37). 워커가 무응답일 때 매 진단이 위 타임아웃을 기다리지 않도록
    # 연속 실패를 감지해 즉시 폴백하고, 복구를 자동 감지한다. 값 근거는 AiResilienceProperties.
    resilience:
      sliding-window-size: 10
      minimum-number-of-calls: 5   # 라이브러리 기본 100 — 안 주면 소규모에서 회로가 안 열림
      failure-rate-threshold: 50
      wait-duration-in-open: 30s
      permitted-calls-in-half-open: 3

  # 운영자 알림(#39). webhook-url은 시크릿이라 여기 적지 않는다 — 환경변수
  # OPENCERTFLOW_ALERT_WEBHOOK_URL로만 주입하며, 값이 없으면 발송·폴링이 통째로 비활성이다.
  alert:
    poll-interval: 1m   # ERROR 카운터 확인 주기. 근거는 AlertProperties javadoc

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # 메일 헬스 체크는 매번 SMTP에 접속을 시도한다. 시연 환경에서 메일 서버가 없거나 느리면
    # 헬스 프로브 자체가 실패·지연되어 배포가 죽은 것처럼 보인다. 인증 코드 발송은 실패해도
    # 서비스 본체(진단)는 계속 동작해야 하므로 헬스 판정에서 뺀다.
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    io.opencertflow: INFO

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    io.opencertflow: DEBUG
    org.hibernate.SQL: DEBUG
