name: "🐛 Bug"
description: "의도대로 동작하지 않는 문제 신고"
title: "[ 페이지명 ] "
labels: ["버그"]
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[ 페이지명 ] 내용` 형식으로 작성합니다. (예: `[ Main ] 목록 스크롤 시 앱 종료`)
        **대괄호 안에 띄어쓰기가 있어요!**
  - type: textarea
    attributes:
      label: 🐛 어떤 문제인가요?
      description: 어떤 문제가 발생하는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔁 재현 절차
      description: 문제를 재현하는 단계를 순서대로 적어주세요.
      placeholder: |
        1. ...
        2. ...
        3. 오류 발생
    validations:
      required: true
  - type: textarea
    attributes:
      label: 💚 기대 동작
      description: 원래 어떻게 동작해야 하는지 적어주세요.
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ To Dos
      description: 해결을 위해 할 일을 체크박스로 적어주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: false
  - type: textarea
    attributes:
      label: 🙋🏻 환경 / 로그
      description: 실행 환경, traceId, 오류 로그 등을 남겨주세요.
