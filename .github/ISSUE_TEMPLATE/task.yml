name: 작업 / 인프라
description: 기능 외 작업(리팩터링·인프라·문서·테스트)을 등록합니다
title: "CHORE: "
labels: []
body:
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 무엇을 할지 설명하세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 어떤 상태가 되면 완료로 볼지 적으세요.
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: 분류
      options:
        - 인프라
        - 문서
        - 테스트
        - 리팩터링
        - 기타
    validations:
      required: false
