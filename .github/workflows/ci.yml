name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 브랜치에서 이전 실행이 진행 중이면 취소하고 최신만 유지
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # 단위·ArchUnit·BlockHound·Testcontainers 통합 테스트.
      # ArchUnit이 여기서 빠지면 단일 모듈 헥사고날의 전제가 무너진다(ADR-0001).
      # Testcontainers는 GitHub Actions ubuntu 러너의 Docker를 그대로 사용한다.
      - name: 테스트 실행
        run: ./gradlew --no-daemon test

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore
