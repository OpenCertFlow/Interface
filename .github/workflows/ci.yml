name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 동일 브랜치에서 이전 실행이 진행 중이면 취소하고 최신만 유지
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 룰 파일 검증은 DB도 스프링 컨텍스트도 필요 없다. 커뮤니티 기여의 1차 관문이므로
  # 무거운 테스트를 기다리지 않고 30초 안에 결과를 준다.
  rules:
    name: 룰 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x ./gradlew

      # 구조(JSON Schema) · 값 타입(RuleJsonCodec) · 의미(RuleConsistencyChecker) 세 겹.
      - name: 룰 YAML 검증
        run: ./gradlew --no-daemon validateRules

  test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 17 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # 되돌릴 수 없는 포맷 훼손(미사용 import·후행 공백·개행 누락)만 본다.
      # 전체 포매터는 의도적으로 걸지 않는다 — build.gradle의 spotless 블록 주석 참조.
      - name: 포맷 검사
        run: ./gradlew --no-daemon spotlessCheck

      # 단위·ArchUnit·BlockHound·Testcontainers 통합 테스트.
      # ArchUnit이 여기서 빠지면 단일 모듈 헥사고날의 전제가 무너진다(ADR-0001).
      # Testcontainers는 GitHub Actions ubuntu 러너의 Docker를 그대로 사용한다.
      - name: 테스트 실행
        run: ./gradlew --no-daemon test

      # 커밋된 openapi/openapi.json이 실제 API와 같은지 본다. 이 검사가 없으면 SDK가
      # 조용히 낡고, 사용자는 존재하지 않는 필드를 부르다 런타임에야 알게 된다.
      - name: OpenAPI 스펙 드리프트 검사
        run: ./gradlew --no-daemon checkOpenApiSpec

      - name: 커버리지 리포트
        if: always()
        run: ./gradlew --no-daemon jacocoTestReport

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/reports/jacoco
          retention-days: 7
          if-no-files-found: ignore

  # 의존성 취약점. 실패시키지 않고 보고만 한다 — 상위 라이브러리가 고치기 전까지
  # 우리가 할 수 있는 게 없는 경보로 PR을 막으면 결국 무시하게 된다.
  vulnerabilities:
    name: 의존성 취약점 스캔
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x ./gradlew

      # OSV-Scanner는 Gradle 락파일이 없으면 소스 매니페스트를 훑는다.
      # 태그는 정확한 버전으로 고정한다 — `@v2` 같은 이동 태그는 이 저장소에 존재하지 않아
      # "Unable to resolve action"으로 죽는다(실제로 겪었다).
      - name: OSV 스캔
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --recursive
            ./
