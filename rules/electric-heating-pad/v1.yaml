# yaml-language-server: $schema=../../schema/ruleset.schema.json
#
# 전기방석 룰셋 v1 — 뼈대 (공식 확인 전)
#
# ⚠️ 이 룰셋은 아직 "무엇이 필요한지" 단정하지 않는다.
#
# 전기방석의 인증 등급(안전인증/안전확인/공급자적합성)과 요구 서류는 공식 자료로 확인하기
# 전까지 여기에 적지 않는다. 확인되지 않은 값을 넣으면 **틀린 답을 자신 있게** 말하게 되고,
# 그것은 이 서비스가 하지 않기로 한 일이다(불변식 6: 출처 없는 근거는 근거가 아니다).
#
# 대신 조건 분기는 실제로 동작시키되 결론을 '전문가 확인 필요'로 보낸다. 룰이 판단할 수
# 없을 때의 정상 동작이며(불변식 5), 사용자에게도 정직하다.
#
# ── 공식 확인 후 해야 할 일 ─────────────────────────────────────────────────
#   1. safetykorea.kr 품목 분류에서 '전기방석/전기요' 인증 등급 확인
#   2. 해당 등급의 요구 서류 목록 확인
#   3. [TODO-확인후] 표시된 룰의 flagExpertReview를 addCandidate + requireDocument로 교체
#   4. R-EH-001의 schemeCode / certificationType을 확인된 값으로 지정
#   5. weights/document-weights.yaml에 새 서류 코드의 가중치 추가

productGroup: ELECTRIC_HEATING_PAD
version: 1
active: true
description: 전기방석 룰셋 — 조건 분기만 동작하고 등급·서류는 공식 확인 전

rules:
  # ── 제품 식별 ──────────────────────────────────────────────────────────────

  # [TODO-확인후] 인증 등급이 확인되면 flagExpertReview를 아래로 교체:
  #   - { type: addCandidate, schemeCode: <확인된_제도코드>, certificationType: <확인된_등급> }
  #   - { type: requireDocument, documentCode: ..., requirement: REQUIRED }
  - code: R-EH-001
    priority: 10
    description: 전기 사용 + 신체 접촉 발열 제품 식별. 등급·서류는 공식 확인 전이라 전문가 확인으로 보낸다
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: BODY_CONTACT_TYPE, operator: IN, value: [DIRECT_SKIN, THROUGH_CLOTHING, THROUGH_COVER] }
    effects:
      - { type: requireDocument, documentCode: BIZ_LICENSE, requirement: REQUIRED }
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 신체에 닿는 발열 제품입니다. 적용되는 인증 제도와 등급을 인증기관에 확인해 주세요. (서비스에서 공식 기준 확인 후 자동 안내 예정)

  - code: R-EH-001C
    priority: 11
    description: 신체 접촉 방식 모름 → 판단 불가
    condition: { type: attr, attribute: BODY_CONTACT_TYPE, operator: EQ, value: UNKNOWN }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 신체에 닿는 방식을 모르면 화상 위험 기준을 판단할 수 없습니다. 직접 피부·의류 위·커버를 통한 접촉 중 어디에 해당하는지 확인해 주세요.

  - code: R-EH-003
    priority: 5
    description: 의료적 효능 표방 시 의료기기 규제 가능성 — 규제 영역 자체가 달라진다
    condition: { type: attr, attribute: MEDICAL_USE_CLAIM, operator: EQ, value: true }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 혈액순환·통증 완화 등 의료적 효능을 표시·광고하면 전기용품이 아니라 의료기기로 분류될 수 있어 인증 경로가 완전히 달라집니다. 표방 문구가 의료적 효능에 해당하는지 확인해 주세요.

  # ── 과열·화상 위험 ─────────────────────────────────────────────────────────

  - code: R-EH-002
    priority: 20
    description: 온도조절기 미탑재 시 과열 위험 확인 필요
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: BODY_CONTACT_TYPE, operator: IN, value: [DIRECT_SKIN, THROUGH_CLOTHING, THROUGH_COVER] }
        - { type: attr, attribute: CONTROLLER_STATUS, operator: EQ, value: ABSENT }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 온도조절기가 없습니다. 장시간 사용 시 과열·화상 위험과 관련해 어떤 시험이 필요한지 확인이 필요합니다.

  - code: R-EH-002B
    priority: 21
    description: 온도조절기 유무 모름 → 판단 불가
    condition: { type: attr, attribute: CONTROLLER_STATUS, operator: EQ, value: UNKNOWN }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 온도조절기 탑재 여부를 모르면 과열 보호 수준을 판단할 수 없습니다. 제품의 온도조절기 유무를 확인해 주세요.

  - code: R-EH-004
    priority: 20
    description: 과열 방지 장치 미탑재 시 화상 위험 확인 필요
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: BODY_CONTACT_TYPE, operator: IN, value: [DIRECT_SKIN, THROUGH_CLOTHING, THROUGH_COVER] }
        - { type: attr, attribute: OVERHEAT_PROTECTION, operator: EQ, value: false }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 과열 방지(온도 제한) 장치가 없습니다. 신체에 닿는 발열 제품은 이상 과열 시 화상 위험이 커, 어떤 안전 장치·시험이 요구되는지 확인이 필요합니다.

  - code: R-EH-008
    priority: 24
    description: 온도제한장치 미탑재 시 화상 위험 확인 필요
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: BODY_CONTACT_TYPE, operator: IN, value: [DIRECT_SKIN, THROUGH_CLOTHING, THROUGH_COVER] }
        - { type: attr, attribute: TEMPERATURE_LIMIT_DEVICE, operator: EQ, value: false }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 표면온도 상한을 제한하는 장치가 없습니다. 신체에 닿는 발열 제품은 상시 고온 노출로 저온화상 위험이 있어, 온도 제한과 관련해 어떤 요건이 필요한지 확인해 주세요.

  - code: R-EH-007
    priority: 22
    description: 조절 방식 기타·미확인 → 확인 필요
    condition: { type: attr, attribute: ADJUSTMENT_MODE, operator: EQ, value: OTHER }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 온도 조절 방식이 확인되지 않았습니다. 단계 조절인지 연속 조절인지에 따라 요구되는 시험이 달라질 수 있으니 확인해 주세요.

  # ── 표면온도 근거 ──────────────────────────────────────────────────────────

  - code: R-EH-006
    priority: 26
    description: 표면온도가 추정값이면 측정값 확보 필요
    condition: { type: attr, attribute: TEMPERATURE_SOURCE, operator: EQ, value: ESTIMATED }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 표면온도가 자체 추정값입니다. 화상 위험 기준 판단에는 시험기관 측정값이 필요하니 측정을 통해 확인해 주세요.

  - code: R-EH-090
    priority: 90
    description: 표면온도 미상 시 판단 불가 → 전문가 확인
    condition: { type: attr, attribute: TEMPERATURE_SOURCE, operator: EQ, value: UNKNOWN }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 최고 표면온도를 모르면 화상 위험 기준 충족 여부를 판단할 수 없습니다. 시험기관에서 표면온도를 측정해 확인해 주세요.

  # ── 세탁·구조 ──────────────────────────────────────────────────────────────

  - code: R-EH-005
    priority: 25
    description: 세탁 가능 + 전기부 분리 불가 시 감전·절연 위험 확인
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: WASHABLE, operator: EQ, value: true }
        - { type: attr, attribute: SEPARABLE_ELECTRIC_PARTS, operator: EQ, value: false }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 물세탁이 가능하지만 열선·컨트롤러 등 전기부를 분리할 수 없습니다. 세탁 후 감전·절연 손상 위험과 관련해 방수·절연 시험 요건을 확인해 주세요.

  - code: R-EH-030
    priority: 40
    description: 미인증 별도 어댑터 사용 시 어댑터 인증 범위 확인 필요
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: HAS_SEPARATE_ADAPTER, operator: EQ, value: true }
        - { type: attr, attribute: ADAPTER_CERTIFIED, operator: EQ, value: false }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 별도 전원 어댑터를 쓰지만 어댑터 자체 인증이 확인되지 않았습니다. 어댑터가 인증 대상·범위에 포함되는지 확인해 주세요.

  # ── 표시·라벨링 ────────────────────────────────────────────────────────────

  - code: R-EH-010
    priority: 30
    description: 전기용품 공통 표시사항. 발열 제품 고유 표시는 공식 확인 후 추가
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: RATED_VOLTAGE, operator: GT, value: 50 }
    effects:
      - { type: addLabelingCheck, label: 정격전압·소비전력 표시 }
      - { type: addLabelingCheck, label: 제조자(수입자)·제조국 표시 }
      - { type: requireDocument, documentCode: SAFETY_LABEL_SAMPLE, requirement: RECOMMENDED }

  - code: R-EH-011
    priority: 30
    description: 커버 분리형 제품의 세탁·분리 방법 표시
    condition: { type: attr, attribute: REMOVABLE_COVER, operator: EQ, value: true }
    effects:
      - { type: addLabelingCheck, label: 커버 분리·세탁 방법 및 전기부 취급 주의사항 표시 }

  # ── 대상 사용자 ────────────────────────────────────────────────────────────

  # 소형가전 룰셋(R-SA-010)과 동일한 근거를 쓴다.
  - code: R-EH-020
    priority: 10
    description: 어린이용 제품은 어린이제품 안전인증 대상 후보
    condition: { type: attr, attribute: TARGET_USER, operator: EQ, value: CHILD }
    effects:
      - { type: addCandidate, schemeCode: KC_CHILD_SAFETY_CERT, certificationType: SAFETY_CERT }

  # ── 전원 ───────────────────────────────────────────────────────────────────

  - code: R-EH-091
    priority: 91
    description: 정격전압 미상 시 판단 불가 → 전문가 확인
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: RATED_VOLTAGE, operator: EQ, value: null }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 정격전압 정보가 없어 적용 제도를 판단할 수 없습니다. 어댑터·전원부에 표시된 정격전압을 확인해 주세요.

  # ── 제품군 공통 룰 (R-COM-*) ────────────────────────────────────────────────
  # 모든 제품군 룰셋에 같은 내용으로 존재한다. 한쪽만 고치지 않도록 주의한다.

  - code: R-COM-001
    priority: 50
    description: 변경 모델 → 기존 인증 범위 확인 필요
    condition: { type: attr, attribute: IS_MODIFIED_MODEL, operator: EQ, value: true }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 기존 인증받은 모델을 변경한 제품입니다. 변경 범위가 기존 인증 범위를 벗어나 재인증·변경신고가 필요한지 확인해 주세요.

  - code: R-COM-002
    priority: 51
    description: 수입·OEM·ODM → 제조 책임·서류 확인 필요
    condition: { type: attr, attribute: MANUFACTURING_TYPE, operator: IN, value: [IMPORTED, OEM, ODM] }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 수입·OEM·ODM 제품은 제조 책임 주체와 확보 가능한 제조자 자료(시험성적서·설계자료 등)가 달라집니다. 인증 책임과 필요 서류를 확인해 주세요.
