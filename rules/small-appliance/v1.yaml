# yaml-language-server: $schema=../../schema/ruleset.schema.json
#
# 소형가전 룰셋 v1
#
# ── 인증 등급의 근거 ─────────────────────────────────────────────────────────
#
# 등급은 제품군이 아니라 <품목> 단위로 정해진다. 「전기용품 및 생활용품 안전관리법
# 시행규칙」의 별표가 품목을 나열하며, 같은 소형가전 안에도 등급이 섞여 있다.
#
#   별표 3 안전인증대상   5) 모발관리기(헤어드라이어) · 3) 주방용전열기구 · 25) 가습기 …
#   별표 4 안전확인대상   3) 이·미용기기 · 42) 전기청소기 · 45) 전기건조기 …
#
# 예전 룰은 "전기 사용 + 50V 초과"만 보고 소형가전 전체에 안전확인을 붙였다. 그 결과
# 헤어드라이어에 받아야 할 인증을 축소해 안내했다(#26). 등급은 이제 품목 룰이 정한다.
#
# 확인 방법: CONTRIBUTING.md의 "인증 등급을 확인하는 절차"
# 품목 목록: docs/reference/전기용품-별표-품목.md
#
# 이 파일이 룰의 진실의 원천(source of truth)이다 — DB는 런타임 사본일 뿐이며
# 기동 시 RuleFileLoader가 이 파일로 덮어쓴다.
#
# 검증:  ./gradlew validateRules      또는  opencertflow validate rules/
# 스키마: schema/ruleset.schema.json

productGroup: SMALL_APPLIANCE
version: 1
active: true
description: 소형가전(드라이어류) 데모 룰셋

rules:
  # ── 등급은 품목이 정한다 ────────────────────────────────────────────────────
  #
  # 예전 R-SA-001은 "전기 사용 + 50V 초과"만 보고 소형가전 전체에 안전확인을 붙였다.
  # 그래서 헤어드라이어(별표 3 안전인증 대상)에 받아야 할 인증을 축소해 안내했다.
  # 이제 등급은 품목 룰이 정하고, 이 룰은 전기용품 공통 서류만 요구한다.

  - code: R-SA-001
    priority: 10
    description: 전기 사용 + 정격전압 50V 초과 → 전기용품 공통 서류
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: RATED_VOLTAGE, operator: GT, value: 50 }
    effects:
      - { type: requireDocument, documentCode: BIZ_LICENSE, requirement: REQUIRED }
      - { type: requireDocument, documentCode: TEST_REPORT, requirement: REQUIRED }
      - { type: requireDocument, documentCode: CIRCUIT_DIAGRAM, requirement: RECOMMENDED }
      - { type: requireDocument, documentCode: PARTS_LIST, requirement: RECOMMENDED }

  # 별표 3 · 안전인증대상전기용품 — 제품시험 + 공장심사
  #    2) 전기다리미 및 전기프레스기   3) 주방용전열기구   5) 모발관리기
  #    8) 전기액체가열기기            16) 전열기구        17) 전기마사지기
  #   25) 가습기
  - code: R-SA-020
    priority: 15
    description: 별표 3 품목 → 안전인증 대상
    condition:
      type: attr
      attribute: APPLIANCE_ITEM
      operator: IN
      value: [ELECTRIC_IRON, KITCHEN_HEATING_APPLIANCE, HAIR_CARE_DEVICE,
              LIQUID_HEATING_APPLIANCE, HEATING_APPLIANCE, ELECTRIC_MASSAGER, HUMIDIFIER]
    effects:
      - { type: addCandidate, schemeCode: KC_SAFETY_CERT_ELECTRIC, certificationType: SAFETY_CERT }
      - { type: requireDocument, documentCode: CIRCUIT_DIAGRAM, requirement: REQUIRED }
      - { type: requireDocument, documentCode: PARTS_LIST, requirement: REQUIRED }
      # 안전인증은 서류만으로 끝나지 않는다. 뒤늦게 알면 일정과 비용이 함께 틀어진다.
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 안전인증은 제품시험과 함께 제조공장 심사를 받습니다. 공장 소재지와 생산 설비 기준을 인증기관에 미리 확인해 주세요.

  # 별표 4 · 안전확인대상전기용품 — 시험성적서 제출 후 신고
  #    3) 이·미용기기   7) 구강청결기   42) 전기청소기
  #   45) 전기건조기(손·발·의류·농산물 등. 모발은 별표 3의 모발관리기다)
  - code: R-SA-021
    priority: 15
    description: 별표 4 품목 → 안전확인 대상
    condition:
      type: attr
      attribute: APPLIANCE_ITEM
      operator: IN
      value: [BEAUTY_DEVICE, ORAL_CLEANER, VACUUM_CLEANER, DRYING_APPLIANCE]
    effects:
      - { type: addCandidate, schemeCode: KC_SAFETY_CONFIRM_ELECTRIC, certificationType: SAFETY_CONFIRM }

  # 별표 5 · 공급자적합성확인대상전기용품 — 제조·수입자가 스스로 확인해 신고
  #    4) 애완동물 목욕기    6) 전기시계          7) 적외선·자외선방사 피부관리기
  #   11) 보풀 제거기       13) 전기 작동 도어록  14) 직류 공기청정기
  #   15) 전동형 롤스크린
  #
  # 인증기관을 거치지 않으므로 KC 인증 등록부에 나타나지 않는다. 등록부에서 안 보인다고
  # "인증이 필요 없다"고 읽으면 안 된다 — 신고 의무는 있다.
  - code: R-SA-023
    priority: 15
    description: 별표 5 품목 → 공급자적합성확인 대상
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - type: attr
          attribute: APPLIANCE_ITEM
          operator: IN
          value: [PET_BATH, ELECTRIC_CLOCK, SKIN_CARE_RADIATION_DEVICE, LINT_REMOVER,
                  ELECTRIC_DOOR_LOCK, AIR_PURIFIER_DC, MOTORIZED_ROLL_SCREEN]
    effects:
      - { type: addCandidate, schemeCode: KC_SUPPLIER_DOC_ELECTRIC, certificationType: SUPPLIER_DOC }

  # 품목을 모르면 등급을 고를 수 없다. 안전인증으로 뭉개면 불필요한 공장심사 비용을,
  # 안전확인으로 뭉개면 받아야 할 인증 누락을 안내하게 된다. 어느 쪽도 해서는 안 된다.
  - code: R-SA-022
    priority: 14
    description: 품목 미확인 → 등급 판단 불가
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: APPLIANCE_ITEM, operator: IN, value: [UNKNOWN, OTHER] }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 인증 등급은 제품군이 아니라 품목별로 정해집니다(시행규칙 별표 3·4·5). 제품이 어느 품목에 해당하는지 확인해 주세요.

  - code: R-SA-002
    priority: 20
    description: 전기용품 표시·라벨링 확인 항목
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: RATED_VOLTAGE, operator: GT, value: 50 }
    effects:
      - { type: addLabelingCheck, label: KC 마크 및 안전확인 표시 }
      - { type: addLabelingCheck, label: 정격전압·소비전력 표시 }
      - { type: requireDocument, documentCode: SAFETY_LABEL_SAMPLE, requirement: REQUIRED }

  - code: R-SA-010
    priority: 10
    description: 어린이용 제품은 어린이제품 안전인증 대상 후보
    condition: { type: attr, attribute: TARGET_USER, operator: EQ, value: CHILD }
    effects:
      - { type: addCandidate, schemeCode: KC_CHILD_SAFETY_CERT, certificationType: SAFETY_CERT }

  - code: R-SA-090
    priority: 90
    description: 정격전압 미상 시 판단 불가 → 전문가 확인
    condition:
      type: allOf
      conditions:
        - { type: attr, attribute: USES_ELECTRICITY, operator: EQ, value: true }
        - { type: attr, attribute: RATED_VOLTAGE, operator: EQ, value: null }
        - type: not
          condition: { type: attr, attribute: HAS_BATTERY, operator: EQ, value: true }
    effects:
      - type: flagExpertReview
        reason: AMBIGUOUS_CONDITION
        question: 정격전압 정보가 없어 안전확인 대상 여부를 판단할 수 없습니다. 정격전압을 확인해 주세요.

  # ── 제품군 공통 룰 (R-COM-*) ────────────────────────────────────────────────
  # 모든 제품군 룰셋에 같은 내용으로 존재한다. 한쪽만 고치지 않도록 주의한다.

  - code: R-COM-001
    priority: 50
    description: 변경 모델 → 기존 인증 범위 확인 필요
    condition: { type: attr, attribute: IS_MODIFIED_MODEL, operator: EQ, value: true }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 기존 인증받은 모델을 변경한 제품입니다. 변경 범위가 기존 인증 범위를 벗어나 재인증·변경신고가 필요한지 확인해 주세요.

  - code: R-COM-002
    priority: 51
    description: 수입·OEM·ODM → 제조 책임·서류 확인 필요
    condition: { type: attr, attribute: MANUFACTURING_TYPE, operator: IN, value: [IMPORTED, OEM, ODM] }
    effects:
      - type: flagExpertReview
        reason: NO_EVIDENCE
        question: 수입·OEM·ODM 제품은 제조 책임 주체와 확보 가능한 제조자 자료(시험성적서·설계자료 등)가 달라집니다. 인증 책임과 필요 서류를 확인해 주세요.
